name: VoxelWorld
options:
  bundleIdPrefix: com.voxparty
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: VoxelWorld/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.voxparty.VoxelWorld
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  VoxelWorld:
    type: application
    platform: iOS
    sources:
      - path: VoxelWorld
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: VoxelWorld/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.voxparty.VoxelWorld
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
