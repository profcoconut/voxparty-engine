[package]
name = "voxparty"
version = "0.1.0"
edition = "2024"

[lib]
name = "voxparty"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voxparty"
path = "src/main.rs"

[dependencies]
sdl2 = "0.37"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = "0.19"
log = "0.4"
cfg-if = "1.0"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
