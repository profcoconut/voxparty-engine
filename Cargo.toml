[package]
name = "voxparty"
version = "0.1.0"
edition = "2021"

[lib]
name = "voxparty"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voxparty"
path = "src/main.rs"

[dependencies]
bevy = "0.18" # Bevy game engine — https://bevyengine.org/
sdl2 = "0.37"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
rodio = "0.19"
log = "0.4"
cfg-if = "1.0"
chrono = "0.4"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
env_logger = "0.11"

# Mobile also needs env_logger (try_init is a no-op without it)
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
env_logger = "0.11"

# iOS Core Haptics for haptic feedback
[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-haptics = "0.3"

[profile.release]
opt-level = 3
lto = true
